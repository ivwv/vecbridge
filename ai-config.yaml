# AI Context Generator Configuration

# 扫描入口 (支持混合使用本地路径和远程仓库)
# inputs 列表可以包含:
# 1. 本地文件夹或文件 (支持 Glob 模式，如 ./src 或 ./*.ts)
# 2. Git 仓库地址 (支持 GitHub, GitLab, Bitbucket 等)
#    - 简单格式: https://github.com/user/repo
#    - 指定分支: { url: https://github.com/user/repo, branch: develop }
inputs:
  - .
  # 示例: 同时分析本地代码和远程仓库
  # - ./src
  # - https://github.com/lodash/lodash
  # - url: https://github.com/user/repo
  #   branch: develop

# 输出文件路径
output: ai-context.md

# 目录树显示模式: full (显示所有文件) 或 filtered (仅显示被包含的文件)
treeMode: filtered

# Git 仓库默认分支 (可被单个 input 的 branch 覆盖)
# branch: main

# 自定义排除列表 (系统已内置了常见的 node_modules、图片、视频等排除项)
exclude:
  - temp
  - secrets
  - api.html
  - sample-sheets.ts
  - "*.log"

# 单个文件大小限制 (支持 KB, MB 单位或乘法运算)
# maxFileSize: 500KB
# 压缩模式：移除空行和行尾空白，减少 token 消耗
# compact: false
